<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Log in</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- tailwind and daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">


    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-50">
        <img src="assets/Logo-full.png" alt="">
    </div>
    <div class="form pt-20 flex justify-center">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow">
            <div class="card-body rounded-2xl">
                <fieldset class="fieldset space-y-[4px]">
                    <label class="label text-[#080808] text-[16px] font-medium ">Mobile Number</label>
                    <input id="text-n" maxlength="11" minlength="11" type="text"
                    value="01401734651" class="input rounded-[32px] bg-[#F4F5F7] " placeholder="Enter your number" />
                    <label class="label text-[#080808] text-[16px] font-medium">4 Digit Pin</label>
                    <input  id="text-p" type="password" maxlength="4" class="input rounded-[32px] bg-[#F4F5F7]" placeholder="Enter 4 Digit Pin" />
                    
                    <button id="login-btn" class="btn rounded-full btn-primary text-[20px] font-semibold mt-4 pt-[14px] pb-[14px]">Login</button>
                </fieldset>
            </div>
        </div>
    </div>

    <script>
       
    </script>
<script src="./script/login.js"></script>
</body>

</html>
